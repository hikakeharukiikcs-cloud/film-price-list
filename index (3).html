<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>建築用フィルム 価格表・比較ポータル</title>
    <!-- Firebase SDK (v9/v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #059669;
            --success-bg: #ecfdf5;
            --radius: 10px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* 画面ヘッダー */
        .app-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 16px 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }

        .header-badge {
            background: rgba(255,255,255,0.18);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Firebase同期ステータスバー (コンパクト) */
        .sync-bar {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.725rem;
            color: #cbd5e1;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.active {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .btn-config {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-config:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* フィルターパネル */
        .filter-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius);
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .filter-input, .filter-select {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-input:focus, .filter-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .btn-action-group {
            display: flex;
            gap: 6px;
        }

        .btn-reset, .btn-add {
            height: 38px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            flex: 1;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-add {
            background: var(--success);
            color: #ffffff;
            flex: 1.2;
        }

        .btn-add:hover {
            background: #047857;
        }

        /* メインコンテンツエリア */
        .main-container {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        /* モード切替タブ */
        .tab-container {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            gap: 4px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 12px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* 結果件数バー */
        .result-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-count {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.05rem;
        }

        /* カードリスト */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 16px;
            transition: border-color 0.2s;
        }

        .product-card:hover {
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 14px;
        }

        .card-title-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .type-badge {
            display: inline-block;
            align-self: flex-start;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--primary-dark);
            background: var(--primary-light);
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 2px;
            border: 1px solid #bfdbfe;
        }

        .product-code {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .product-name {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-info {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 4px;
            font-size: 0.78rem;
        }

        .meta-item {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            color: #334155;
            font-weight: 600;
        }

        /* ステータスバッジ */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .status-標準 {
            background: #f1f5f9;
            color: #64748b;
        }

        .status-新製品 {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        .status-廃盤 {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        /* サイズ別コンテナ構造（同一枠組み内サイズ並列） */
        .size-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .size-block {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px;
        }

        .size-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .size-title {
            font-size: 0.875rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px;
        }

        .rank-block {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 10px;
        }

        .rank-block.selected-rank {
            border: 2px solid var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .rank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .rank-title {
            font-size: 0.825rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* 編集・削除アクションボタン */
        .item-actions {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #e2e8f0;
        }

        /* 4項目価格: 文字の大小・強弱で優劣をつけず、すべて同じフォントサイズ・同じ太さ（均等扱い） */
        .price-grid-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .price-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .price-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* 価格数値: 4項目すべて同一のフォントサイズ (0.925rem) ・ 同一の太さ (600) */
        .price-value {
            font-size: 0.925rem;
            font-weight: 600;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .price-none {
            font-size: 0.825rem;
            font-weight: 500;
            color: #94a3b8;
            font-style: italic;
        }

        /* 差額タグ（値上げ：赤字で強調） */
        .diff-tag {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--danger);
            background: var(--danger-bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #fecaca;
            display: inline-block;
        }

        .diff-tag-down {
            color: var(--primary);
            background: var(--primary-light);
            border: 1px solid #bfdbfe;
        }

        .diff-tag-same {
            color: #64748b;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        /* カタログテーブル (PC用 / スマホ横スクロール) */
        .table-wrapper {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            white-space: nowrap;
        }

        .catalog-table th {
            background: #f1f5f9;
            color: var(--text-muted);
            font-weight: 800;
            padding: 12px 14px;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .catalog-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
        }

        .catalog-table tr:hover {
            background: #f8fafc;
        }

        /* テーブル内価格セルも均一 */
        .table-price-cell {
            font-size: 0.925rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* モーダルダイアログ (編集・登録・Firebase設定) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-input {
            height: 36px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-light);
            padding-top: 12px;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 空状態 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        /* レスポンシブ微調整 */
        @media (max-width: 640px) {
            .app-header {
                padding: 12px;
            }
            .header-title {
                font-size: 1.05rem;
            }
            .filter-panel {
                grid-template-columns: 1fr 1fr;
            }
            .filter-group.full-width {
                grid-column: span 2;
            }
            .price-grid-4 {
                grid-template-columns: 1fr 1fr;
            }
            .product-card {
                padding: 12px;
            }
            .price-value {
                font-size: 0.875rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダーエリア -->
    <header class="app-header">
        <div class="header-container">
            <div class="header-title-area">
                <h1 class="header-title">
                    <span>🏢 建築用フィルム 価格表ポータル</span>
                    <span class="header-badge">2025/2026価格改定対応</span>
                </h1>
            </div>

            <!-- Firebase同期設定ステータス (小さく配置) -->
            <div class="sync-bar">
                <div class="sync-status">
                    <span class="status-dot" id="syncDot"></span>
                    <span id="syncText">クラウド同期: 未設定 (ローカルモード動作中)</span>
                </div>
                <button class="btn-config" id="openFirebaseModal">☁️ クラウド同期設定</button>
            </div>

            <!-- フィルターコントロール -->
            <div class="filter-panel">
                <div class="filter-group full-width">
                    <label class="filter-label" for="searchInput">キーワード検索</label>
                    <input type="search" id="searchInput" class="filter-input" placeholder="品番、商品名・仕様、サイズで検索...">
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="typeFilter">タイプ (カテゴリー)</label>
                    <select id="typeFilter" class="filter-select">
                        <option value="ALL">すべてのタイプ</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="dateFilter">施行日</label>
                    <select id="dateFilter" class="filter-select">
                        <!-- JSで動的生成 -->
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="rankFilter">ランク</label>
                    <select id="rankFilter" class="filter-select">
                        <option value="工事店">工事店</option>
                        <option value="問屋">問屋</option>
                        <option value="組合">組合</option>
                    </select>
                </div>
                <div class="btn-action-group">
                    <button id="resetBtn" class="btn-reset">リセット</button>
                    <button id="addNewBtn" class="btn-add">➕ 価格登録</button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-container">
        <!-- モード切替タブ -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="rank">① ランク別比較</button>
            <button class="tab-btn" data-tab="date">② 施行日別比較 (価格推移)</button>
            <button class="tab-btn" data-tab="list">③ 製品一覧 (カタログ)</button>
        </div>

        <!-- 結果件数表示 -->
        <div class="result-bar">
            <span>該当製品数: <span id="resultCount" class="result-count">0</span> 件</span>
            <span id="activeModeDesc" style="font-size:0.78rem; color:#64748b;">同一製品（全サイズ包括）におけるランク別価格比較</span>
        </div>

        <!-- 描画領域 -->
        <div id="contentArea"></div>
    </main>

    <!-- 編集・新規登録モーダル -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">価格データの編集</h3>
                <button class="btn-icon" id="closeModal">✕</button>
            </div>
            <div class="modal-body">
                <form id="priceForm" class="form-grid">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label class="form-label">施行日</label>
                        <input type="text" id="inputDate" class="form-input" placeholder="YYYY-MM-DD" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">ランク</label>
                        <select id="inputRank" class="form-input" required>
                            <option value="工事店">工事店</option>
                            <option value="問屋">問屋</option>
                            <option value="組合">組合</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">タイプ</label>
                        <input type="text" id="inputType" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">品番</label>
                        <input type="text" id="inputCode" class="form-input" required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">商品名・仕様</label>
                        <input type="text" id="inputName" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">サイズ</label>

            localStorage.setItem('film_price_data', JSON.stringify(APP_DATA));
        }

        // Firebase初期化処理
        function initFirebaseIfConfigured() {
            const fbConfigStr = localStorage.getItem('firebase_config');
            const syncDot = document.getElementById('syncDot');
            const syncText = document.getElementById('syncText');

            if (fbConfigStr) {
                try {
                    const config = JSON.parse(fbConfigStr);
                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    }
                    db = firebase.firestore();

                    syncDot.classList.add('active');
                    syncText.textContent = 'クラウド同期: リアルタイム接続中 (Firebase)';

                    // Firestoreのリアルタイムリスナー
                    db.collection('prices').onSnapshot((snapshot) => {
                        if (!snapshot.empty) {
                            const remoteData = [];
                            snapshot.forEach(doc => {
                                remoteData.push({ id: doc.id, ...doc.data() });
                            });
                            if (remoteData.length > 0) {
                                APP_DATA = remoteData;
                                localStorage.setItem('film_price_data', JSON.stringify(APP_DATA));
                                initFilters();
                                render();
                            }
                        }
                    }, (error) => {
                        console.error("Firestore sync error:", error);
                        syncDot.classList.remove('active');
                        syncText.textContent = 'クラウド同期: 接続エラー';
                    });

                } catch(e) {
                    console.error("Firebase init failed:", e);
                    syncDot.classList.remove('active');
                    syncText.textContent = 'クラウド同期: 設定エラー';
                }
            } else {
                syncDot.classList.remove('active');
                syncText.textContent = 'クラウド同期: 未設定 (ローカル動作中)';
            }
        }

        // フィルターオプションの動的初期化
        function initFilters() {
            const currentType = state.selectedType;
            const currentDate = state.selectedDate;

            // タイプ一覧の抽出
            const types = Array.from(new Set(APP_DATA.map(d => d.type))).sort();
            const typeSelect = document.getElementById('typeFilter');
            typeSelect.innerHTML = '<option value="ALL">すべてのタイプ</option>';
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                typeSelect.appendChild(opt);
            });
            typeSelect.value = types.includes(currentType) ? currentType : 'ALL';

            // 施行日一覧の抽出
            const dates = Array.from(new Set(APP_DATA.map(d => d.date))).sort();
            const dateSelect = document.getElementById('dateFilter');
            dateSelect.innerHTML = '';
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d + ' 施行';
                dateSelect.appendChild(opt);
            });

            if (dates.length > 0) {
                if (dates.includes(currentDate)) {
                    state.selectedDate = currentDate;
                    dateSelect.value = currentDate;
                } else {
                    state.selectedDate = dates[0];
                    dateSelect.value = dates[0];
                }
            }
        }

        // イベントバインド
        function bindEvents() {

            // アコーディオン開閉イベント
            const toggleBtn = document.getElementById('togglePanelBtn');
            const collapsiblePanel = document.getElementById('collapsiblePanel');
            const toggleIcon = document.getElementById('toggleIcon');

            if (toggleBtn && collapsiblePanel) {
                toggleBtn.addEventListener('click', () => {
                    const isCollapsed = collapsiblePanel.classList.toggle('collapsed');
                    if (toggleIcon) {
                        toggleIcon.textContent = isCollapsed ? '▼ 開く' : '▲ 閉じる';
                    }
                });

                // スマホ閲覧時は初期状態でアコーディオンを折りたたんで画面を広く保つ
                if (window.innerWidth <= 640) {
                    collapsiblePanel.classList.add('collapsed');
                    if (toggleIcon) toggleIcon.textContent = '▼ 開く';
                }
            }

            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchKeyword = e.target.value.trim().toLowerCase();
                render();
            });

            document.getElementById('typeFilter').addEventListener('change', (e) => {
                state.selectedType = e.target.value;
                render();
            });

            document.getElementById('dateFilter').addEventListener('change', (e) => {
                state.selectedDate = e.target.value;
                render();
            });

            document.getElementById('rankFilter').addEventListener('change', (e) => {
                state.selectedRank = e.target.value;
                render();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('typeFilter').value = 'ALL';
                const dateSelect = document.getElementById('dateFilter');
                if (dateSelect.options.length > 0) dateSelect.selectedIndex = 0;
                document.getElementById('rankFilter').value = '工事店';

                state.searchKeyword = '';
                state.selectedType = 'ALL';
                state.selectedDate = dateSelect.value;
                state.selectedRank = '工事店';
                render();

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.activeTab = e.target.dataset.tab;

                    const descEl = document.getElementById('activeModeDesc');
                    if (state.activeTab === 'rank') {
                        descEl.textContent = '同一製品（全サイズ包括）におけるランク別価格比較';
                    } else if (state.activeTab === 'date') {

                    } else {
                        descEl.textContent = '選択中の施行日・ランクにおけるカタログデータ一覧';

            // 編集モーダル関連

            document.getElementById('closeModal').addEventListener('click', closeEditModal);
            document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
            document.getElementById('savePriceBtn').addEventListener('click', savePriceItem);

            // Firebaseモーダル関連
            document.getElementById('openFirebaseModal').addEventListener('click', () => {
                const cfg = localStorage.getItem('firebase_config') || '';
                document.getElementById('fbConfigJson').value = cfg;
                document.getElementById('firebaseModal').classList.add('active');
            });
            document.getElementById('closeFbModal').addEventListener('click', () => {
                document.getElementById('firebaseModal').classList.remove('active');
            });
            document.getElementById('saveFbConfig').addEventListener('click', () => {
                const val = document.getElementById('fbConfigJson').value.trim();
                if (val) {
                    try {
                        JSON.parse(val);
                        localStorage.setItem('firebase_config', val);
                        alert('Firebase設定を保存しました。再接続します。');
                        location.reload();
                    } catch(e) {
                        alert('JSONの形式が正しくありません。');
                    }
                }
            });
            document.getElementById('clearFbConfig').addEventListener('click', () => {
                localStorage.removeItem('firebase_config');
                alert('Firebase設定を解除しました。');
                location.reload();
            });
        }

        // 価格フォーマットヘルパー
        function formatPrice(val, nullText = '設定なし') {
            if (val === null || val === undefined || isNaN(val)) {
                return `<span class="price-none">${nullText}</span>`;
            }
            return '¥' + Math.round(val).toLocaleString();
        }

        function formatDecimalPrice(val, nullText = '設定なし') {
            if (val === null || val === undefined || isNaN(val)) {
                return `<span class="price-none">${nullText}</span>`;
            }
            return '¥' + Number(val).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        }

        // メインレンダリング
        function render() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            if (state.activeTab === 'rank') {
                renderRankComparisonGrouped(contentArea);
            } else if (state.activeTab === 'date') {
                renderDateComparisonGrouped(contentArea);
            } else if (state.activeTab === 'list') {
                renderProductList(contentArea);
            }
        }

        // ① ランク別比較モード（同製品の異なるサイズを同一枠組みに集約）

        // ② 施行日別比較モード (推移・同製品の異なるサイズを同一枠組みに集約)
        function renderDateComparisonGrouped(container) {
            let filtered = APP_DATA.filter(d => d.rank === state.selectedRank);

            if (state.selectedType !== 'ALL') {
                filtered = filtered.filter(d => d.type === state.selectedType);
            }

            if (state.searchKeyword) {
                const kw = state.searchKeyword;
                filtered = filtered.filter(d => 
                    d.code.toLowerCase().includes(kw) ||
                    d.name.toLowerCase().includes(kw) ||
                    d.size.toLowerCase().includes(kw) ||
                    d.type.toLowerCase().includes(kw)
                );
            }

            const allDates = Array.from(new Set(APP_DATA.map(d => d.date))).sort();
            const oldDate = allDates[0] || '2025-05-01';
            const newDate = allDates[allDates.length - 1] || '2026-07-01';

            // 製品マスター単位 (type, code, condition) で大枠グループ化
            const productGroups = {};
            filtered.forEach(item => {
                const pKey = `${item.type}___${item.code}___${item.condition}`;
                if (!productGroups[pKey]) {
                    productGroups[pKey] = {
                        info: {
                            rank: item.rank,
                            type: item.type,
                            code: item.code,
                            name: item.name,
                            condition: item.condition
                        },
                        sizes: {}
                    };
                }
                
                if (!productGroups[pKey].sizes[item.size]) {
                    productGroups[pKey].sizes[item.size] = {};
                }
                productGroups[pKey].sizes[item.size][item.date] = item;
            });

            const groupKeys = Object.keys(productGroups);
            document.getElementById('resultCount').textContent = groupKeys.length;

            if (groupKeys.length === 0) {
                container.innerHTML = getEmptyStateHTML();
                return;
            }

            const cardList = document.createElement('div');
            cardList.className = 'card-list';

            groupKeys.forEach(pKey => {
                const pGrp = productGroups[pKey];
                const info = pGrp.info;
                const sizeKeys = Object.keys(pGrp.sizes);

                function renderDiffPrice(oldVal, newVal, isDecimal = false) {
                    const formatFn = isDecimal ? formatDecimalPrice : formatPrice;
                    
                    if (oldVal === null && newVal === null) {
                        return `<span class="price-value">${formatFn(null, 'ロール販売のみ')}</span>`;
                    }
                    if (oldVal === null && newVal !== null) {
                        return `<span class="price-value">${formatFn(newVal)}</span> <span class="diff-tag">新規追加</span>`;
                    }
                    if (oldVal !== null && newVal === null) {
                        return `<span class="price-value">${formatFn(oldVal)} → 販売終了</span>`;
                    }

                    const diff = newVal - oldVal;
                    let diffHTML = '';
                    if (Math.abs(diff) < 0.01) {
                        diffHTML = `<span class="diff-tag diff-tag-same">±¥0</span>`;
                    } else if (diff > 0) {
                        const diffStr = isDecimal ? diff.toFixed(1) : Math.round(diff).toLocaleString();
                        diffHTML = `<span class="diff-tag">+¥${diffStr}</span>`;
                    } else {
                        const diffStr = isDecimal ? Math.abs(diff).toFixed(1) : Math.abs(Math.round(diff)).toLocaleString();
                        diffHTML = `<span class="diff-tag diff-tag-down">-¥${diffStr}</span>`;
                    }

                    return `
                        <div style="display:flex; flex-direction:column; gap:2px;">
                            <span class="price-value">${formatFn(oldVal)} → ${formatFn(newVal)}</span>
                            <div>${diffHTML}</div>
                        </div>
                    `;
                }

                let sizesHTML = '';
                sizeKeys.forEach(sz => {
                    const datesData = pGrp.sizes[sz];
                    const oldItem = datesData[oldDate];
                    const newItem = datesData[newDate];

                    let statusBadge = '';
                    if (!oldItem && newItem) {
                        statusBadge = `<span class="status-badge status-新製品">新製品</span>`;
                    } else if (oldItem && !newItem) {
                        statusBadge = `<span class="status-badge status-廃盤">廃盤</span>`;
                    } else if (newItem && newItem.status === '廃盤') {
                        statusBadge = `<span class="status-badge status-廃盤">廃盤</span>`;
                    } else {
                        statusBadge = `<span class="status-badge status-標準">標準</span>`;
                    }

                    sizesHTML += `
                        <div class="size-block">
                            <div class="size-header">
                                <span class="size-title">📐 サイズ: ${escapeHTML(sz)}</span>
                                ${statusBadge}
                            </div>
                            <div class="price-grid-4" style="background:#ffffff; padding:10px; border-radius:6px; border:1px solid var(--border-light);">
                                <div class="price-item">
                                    <span class="price-label">ロール価格(/本)</span>
                                    ${renderDiffPrice(oldItem ? oldItem.roll_price : null, newItem ? newItem.roll_price : null, false)}
                                </div>
                                <div class="price-item">
                                    <span class="price-label">ロール単価(/㎡)</span>
                                    ${renderDiffPrice(oldItem ? oldItem.roll_sqm : null, newItem ? newItem.roll_sqm : null, false)}
                                </div>
                                <div class="price-item">
                                    <span class="price-label">切売価格(/㎡)</span>
                                    ${renderDiffPrice(oldItem ? oldItem.cut_sqm : null, newItem ? newItem.cut_sqm : null, false)}
                                </div>
                                <div class="price-item">
                                    <span class="price-label">売単価(/m)</span>
                                    ${renderDiffPrice(oldItem ? oldItem.cut_m : null, newItem ? newItem.cut_m : null, true)}
                                </div>
                            </div>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'product-card';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div><span class="type-badge">${escapeHTML(info.type)}</span></div>
                            <div class="product-code">${escapeHTML(info.code)}</div>
                            ${info.name ? `<div class="product-name">${escapeHTML(info.name)}</div>` : ''}
                            <div class="meta-info">
                                <span class="meta-item">対象ランク: ${escapeHTML(info.rank)}</span>
                                <span class="meta-item">条件: ${escapeHTML(info.condition)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="price-section-title">📈 施行日別価格推移 (${oldDate} ➔ ${newDate})</div>
                    <div class="size-container">
                        ${sizesHTML}
                    </div>
                `;

                cardList.appendChild(card);
            });

            container.appendChild(cardList);
        }

        // ③ 製品一覧 (カタログ) モード

        // モーダル編集・削除処理
        function openEditModal(id = null) {
            const modal = document.getElementById('editModal');
            const title = document.getElementById('modalTitle');
            
            if (id) {
                const item = APP_DATA.find(d => d.id === id);
                if (!item) return;
                title.textContent = '価格データの編集';
                document.getElementById('editId').value = item.id;
                document.getElementById('inputDate').value = item.date;
                document.getElementById('inputRank').value = item.rank;
                document.getElementById('inputType').value = item.type;
                document.getElementById('inputCode').value = item.code;
                document.getElementById('inputName').value = item.name || '';
                document.getElementById('inputSize').value = item.size;
                document.getElementById('inputCondition').value = item.condition;
                document.getElementById('inputRollPrice').value = item.roll_price !== null ? item.roll_price : '';
                document.getElementById('inputRollSqm').value = item.roll_sqm !== null ? item.roll_sqm : '';
                document.getElementById('inputCutSqm').value = item.cut_sqm !== null ? item.cut_sqm : '';
                document.getElementById('inputCutM').value = item.cut_m !== null ? item.cut_m : '';
                document.getElementById('inputStatus').value = item.status || '標準';
            } else {
                title.textContent = '新規価格データの登録';
                document.getElementById('priceForm').reset();
                document.getElementById('editId').value = '';
                document.getElementById('inputDate').value = state.selectedDate;
                document.getElementById('inputRank').value = state.selectedRank;
            }
            modal.classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function savePriceItem() {
            const id = document.getElementById('editId').value;
            const date = document.getElementById('inputDate').value.trim();
            const rank = document.getElementById('inputRank').value;
            const type = document.getElementById('inputType').value.trim();
            const code = document.getElementById('inputCode').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const size = document.getElementById('inputSize').value.trim();
            const condition = document.getElementById('inputCondition').value.trim();
            
            const roll_price = document.getElementById('inputRollPrice').value !== '' ? parseFloat(document.getElementById('inputRollPrice').value) : null;
            const roll_sqm = document.getElementById('inputRollSqm').value !== '' ? parseFloat(document.getElementById('inputRollSqm').value) : null;
            const cut_sqm = document.getElementById('inputCutSqm').value !== '' ? parseFloat(document.getElementById('inputCutSqm').value) : null;
            const cut_m = document.getElementById('inputCutM').value !== '' ? parseFloat(document.getElementById('inputCutM').value) : null;
            const status = document.getElementById('inputStatus').value;

            if (!date || !type || !code || !size) {
                alert('必須項目（施行日、タイプ、品番、サイズ）を入力してください。');
                return;
            }

            const targetId = id || `${date}_${rank}_${type}_${code}_${size}_${condition}_${Date.now()}`;

            const itemObj = {
                id: targetId,
                date, rank, type, code, name, size, condition,
                roll_price, roll_sqm, cut_sqm, cut_m, status
            };

            if (id) {
                const idx = APP_DATA.findIndex(d => d.id === id);
                if (idx !== -1) APP_DATA[idx] = itemObj;
            } else {
                APP_DATA.push(itemObj);
            }

            // Firestore更新
            if (db) {
                db.collection('prices').doc(targetId).set(itemObj).catch(err => console.error("Firestore save error:", err));
            }

            saveDataStore();
            closeEditModal();
            initFilters();
            render();
        }

        function deletePriceItem(id) {
            if (!confirm('この価格データを削除してもよろしいですか？')) return;

            APP_DATA = APP_DATA.filter(d => d.id !== id);

            if (db) {
                db.collection('prices').doc(id).delete().catch(err => console.error("Firestore delete error:", err));
            }

            saveDataStore();
            initFilters();
            render();
        }

        // 空状態HTML
        function getEmptyStateHTML() {
            return `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <div style="font-weight:800; font-size:1.1rem; margin-bottom:4px;">該当するデータが見つかりません</div>
                    <div style="font-size:0.875rem;">検索キーワードやフィルター設定を変更してください。</div>
                </div>
            `;
        }

        // HTMLエスケープ
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
