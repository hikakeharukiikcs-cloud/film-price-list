<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築用フィルム 価格比較・ポータルサイト</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SheetJS (Excelファイル解析ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase Compat SDKs (オプション) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* モバイルアコーディオン */
    .accordion-content {
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      overflow: hidden;
    }
    .accordion-content.collapsed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .accordion-content.expanded {
      max-height: 1200px;
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ヘッダー (sticky非使用・スクロールで自然に流れる) -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 space-y-4">
      
      <!-- 1行目: タイトル・メイン操作ボタン -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🏢</span>
            <div>
              <h1 class="text-xl font-bold leading-tight">建築用フィルム 価格比較ポータル</h1>
              <p class="text-xs text-slate-400">製品別動的施工日選択・リアルタイム品番検索対応</p>
            </div>
          </div>
          <button id="accordionToggleBtn" onclick="toggleAccordion()" class="md:hidden flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
            <span id="accordionIcon">▼</span>
            <span id="accordionText">詳細フィルター</span>
          </button>
        </div>

        <!-- アクションボタン -->
        <div class="flex flex-wrap items-center gap-2">
          <label class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-lg font-semibold shadow cursor-pointer transition-colors">
            <span>📊</span>
            <span>Excel読込 & プレビュー</span>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" onchange="previewExcelFile(event)" class="hidden">
          </label>

          <button onclick="openSyncModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 transition-colors">
            <span>🔥</span>
            <span>Firebase設定</span>
          </button>
          <button onclick="openEditModal()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow transition-colors">
            <span>➕</span>
            <span>新規データ登録</span>
          </button>
        </div>
      </div>

      <!-- 2行目: 🎯 最上部・メイン品番リアルタイム検索バー -->
      <div class="bg-slate-800/80 p-3 rounded-xl border border-blue-500/40 shadow-inner">
        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-400 text-lg">🔍</span>
          <input type="text" id="searchInput" oninput="applyFilters()" placeholder="品番を入力してリアルタイム絞り込み (例: WH08, 1015UH, ZC05G...)" class="w-full bg-slate-900 border border-blue-500/60 rounded-lg pl-10 pr-10 py-2.5 text-sm text-white placeholder-slate-400 font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
          <button onclick="clearSearchInput()" class="absolute right-3 text-slate-400 hover:text-white text-xs font-bold bg-slate-700 hover:bg-slate-600 rounded-full w-5 h-5 flex items-center justify-center">✕</button>
        </div>
      </div>

      <!-- Firebase 接続状態通知バー -->
      <div id="firebaseStatusContainer" class="hidden pt-1 border-t border-slate-800 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span id="firebaseStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
          <span id="firebaseStatusText" class="text-slate-300">Firebase未接続（ローカルストレージ動作中）</span>
        </div>
      </div>

      <!-- 3行目: 詳細設定フィルターパネル (スマホ時アコーディオン) -->
      <div id="filterPanel" class="accordion-content collapsed md:expanded border-t border-slate-800 pt-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <!-- フィルムタイプフィルター -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">🏷️ フィルムタイプ</label>
            <select id="typeFilter" onchange="applyFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
              <option value="">すべて</option>
            </select>
          </div>

          <!-- 一括施行日フィルター -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">📅 一括施行日選択</label>
            <select id="dateFilter" onchange="applyFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
            </select>
          </div>

          <!-- 一括ランクフィルター -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">👥 一括ランク選択</label>
            <select id="rankFilter" onchange="applyFilters()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
              <option value="工事店">工事店</option>
              <option value="問屋">問屋</option>
              <option value="組合">組合</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- メイン領域 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

    <!-- モード切り替えタブ -->
    <div class="flex border-b border-slate-200 mb-6 bg-white rounded-xl p-1 shadow-sm border">
      <button id="tab-rank" onclick="switchMode('rank')" class="flex-1 py-2.5 px-3 text-center rounded-lg text-sm font-semibold transition-all bg-slate-900 text-white shadow-sm">
        ① ランク別比較モード（製品別施行日選択）
      </button>
      <button id="tab-history" onclick="switchMode('history')" class="flex-1 py-2.5 px-3 text-center rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">
        ② 施行日別比較（製品別ランク選択）
      </button>
    </div>

    <!-- 未読み込み時案内バナー -->
    <div id="importGuideBanner" class="mb-6 p-5 bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">📂</span>
        <div>
          <h4 class="text-sm font-bold text-slate-800">全データ取り込み</h4>
          <p class="text-xs text-slate-600 mt-0.5">右上の「📊 Excel読込 & プレビュー」ボタンから Excel ファイルを選択すると全データがサイトに読み込まれます。</p>
        </div>
      </div>
      <label class="whitespace-nowrap bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow cursor-pointer transition-colors">
        ファイルを選択してプレビュー
        <input type="file" accept=".xlsx, .xls" onchange="previewExcelFile(event)" class="hidden">
      </label>
    </div>

    <!-- 検索件数・状態表示 -->
    <div class="flex items-center justify-between mb-4 px-1">
      <div class="text-xs text-slate-500 font-medium">
        該当製品数: <span id="recordCount" class="text-slate-900 font-bold text-sm">0</span> 件
        <span id="searchActiveBadge" class="hidden ml-2 px-2 py-0.5 bg-blue-100 text-blue-800 font-bold rounded-full text-[10px]">品番絞り込み中</span>
      </div>
      <button onclick="resetFilters()" class="text-xs text-slate-500 hover:text-blue-600 underline">絞り込み解除</button>
    </div>

    <!-- ① ランク別比較モード -->
    <div id="view-rank" class="space-y-6"></div>

    <!-- ② 施行日別比較モード -->
    <div id="view-history" class="hidden space-y-6"></div>

  </main>

  <!-- プレビュー表示 モーダル -->
  <div id="previewModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="text-xl">📊</span>
          <h3 class="text-base font-bold">Excelデータ読み込みプレビュー</h3>
        </div>
        <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 flex-1 text-sm">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
          <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl">
            <span class="text-slate-500 block">総レコード数</span>
            <span id="prevTotalCount" class="text-lg font-bold text-blue-700">0 件</span>
          </div>
          <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
            <span class="text-slate-500 block">検出品番数</span>
            <span id="prevCodeCount" class="text-lg font-bold text-emerald-700">0 品番</span>
          </div>
          <div class="bg-purple-50 border border-purple-200 p-3 rounded-xl">
            <span class="text-slate-500 block">検出施行日</span>
            <span id="prevDates" class="text-xs font-semibold text-purple-800 block truncate mt-1">-</span>
          </div>
          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl">
            <span class="text-slate-500 block">検出ランク</span>
            <span id="prevRanks" class="text-xs font-semibold text-amber-800 block truncate mt-1">-</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">🏷️ 検出された品番サンプル</label>
          <div id="prevCodeBadges" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-2 bg-slate-50 rounded-lg border border-slate-200 text-xs"></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">📋 データサンプル（先頭10件）</label>
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-xs text-left text-slate-600">
              <thead class="bg-slate-100 font-bold border-b border-slate-200">
                <tr>
                  <th class="p-2.5">施行日</th>
                  <th class="p-2.5">ランク</th>
                  <th class="p-2.5">タイプ</th>
                  <th class="p-2.5">品番</th>
                  <th class="p-2.5">サイズ</th>
                  <th class="p-2.5 text-right">ロール単価(㎡)</th>
                  <th class="p-2.5 text-right">切売価格(㎡)</th>
                </tr>
              </thead>
              <tbody id="previewTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-between items-center">
        <button onclick="closePreviewModal()" class="px-4 py-2 border rounded-xl text-xs text-slate-600 hover:bg-slate-100 font-medium">キャンセル</button>
        <button onclick="confirmImport()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center gap-1.5">
          <span>✅</span>
          <span>この内容でサイトに反映する (<span id="confirmBtnCount">0</span>件)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CRUD 編集/新規モーダル -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-4 mb-4 border-b">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800">データ編集</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <form id="editForm" onsubmit="saveData(event)" class="space-y-4 text-sm">
        <input type="hidden" id="edit-id">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">施行日 *</label>
            <input type="date" id="edit-date" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ランク *</label>
            <select id="edit-rank" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="工事店">工事店</option>
              <option value="問屋">問屋</option>
              <option value="組合">組合</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">タイプ *</label>
            <input type="text" id="edit-type" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">品番 *</label>
            <input type="text" id="edit-code" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">商品名・仕様</label>
            <input type="text" id="edit-name" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">サイズ *</label>
            <input type="text" id="edit-size" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">条件・購入数</label>
            <input type="text" id="edit-condition" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" value="標準">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ロール価格_本 (円)</label>
            <input type="number" step="any" id="edit-roll_price" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ロール単価_㎡ (円)</label>
            <input type="number" step="any" id="edit-roll_sqm" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">切売価格_㎡ (円)</label>
            <input type="number" step="any" id="edit-cut_sqm" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">切売単価_m (円)</label>
            <input type="number" step="any" id="edit-cut_m" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">ステータス</label>
            <select id="edit-status" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="標準">標準</option>
              <option value="新製品">新製品</option>
              <option value="在庫限り">在庫限り</option>
              <option value="廃盤">廃盤</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t mt-6">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">キャンセル</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow transition-colors">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase 設定モーダル -->
  <div id="syncModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-3 mb-3 border-b">
        <h3 class="text-lg font-bold text-slate-800">🔥 Firebase リアルタイム同期設定</h3>
        <button onclick="closeSyncModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>
      <textarea id="firebaseConfigInput" rows="7" class="w-full font-mono text-xs border rounded-lg p-3 bg-slate-50 text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder='{ "apiKey": "..." }'></textarea>
      <div class="flex justify-between items-center pt-2 border-t">
        <button onclick="clearFirebaseConfig()" class="text-xs text-red-600 hover:underline">設定クリア</button>
        <div class="flex gap-2">
          <button onclick="closeSyncModal()" class="px-4 py-2 border rounded-lg text-xs text-slate-600">閉じる</button>
          <button onclick="saveFirebaseConfig()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg shadow">接続開始</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let APP_DATA = [];
    let tempParsedData = [];
    let currentMode = 'rank';
    let db = null;
    let unsubscribeFirestore = null;

    let cardDateOverrides = {};
    let cardRankOverrides = {};

    window.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
      initFirebaseIfConfigured();
    });

    function loadInitialData() {
      const local = localStorage.getItem('FILM_PORTAL_PREVIEW_DATA');
      if (local) {
        try {
          APP_DATA = JSON.parse(local);
          if (APP_DATA.length > 0) {
            document.getElementById('importGuideBanner').classList.add('hidden');
          }
        } catch(e) {
          APP_DATA = [];
        }
      }
      setupFilterOptions();
      render();
    }

    function previewExcelFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          
          const rawJson = XLSX.utils.sheet_to_json(worksheet);

          if (!rawJson || rawJson.length === 0) {
            alert('Excelファイルに有効なデータが存在しません。');
            return;
          }

          tempParsedData = rawJson.map((item, idx) => ({
            id: item.id || `${item.date}_${item.rank}_${item.type}_${item.code}_${item.size}_${idx}`,
            date: String(item.date || ''),
            rank: String(item.rank || ''),
            type: String(item.type || ''),
            code: String(item.code || ''),
            name: String(item.name || ''),
            condition: String(item.condition || '標準'),
            size: String(item.size || ''),
            roll_price: item.roll_price !== undefined && item.roll_price !== "" ? parseFloat(item.roll_price) : null,
            roll_sqm: item.roll_sqm !== undefined && item.roll_sqm !== "" ? parseFloat(item.roll_sqm) : null,
            cut_sqm: item.cut_sqm !== undefined && item.cut_sqm !== "" ? parseFloat(item.cut_sqm) : null,
            cut_m: item.cut_m !== undefined && item.cut_m !== "" ? parseFloat(item.cut_m) : null,
            status: String(item.status || '標準')
          }));

          showPreviewModal(tempParsedData);

        } catch (err) {
          console.error(err);
          alert('Excelファイルの解析に失敗しました。');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function showPreviewModal(data) {
      document.getElementById('prevTotalCount').textContent = `${data.length.toLocaleString()} 件`;
      document.getElementById('confirmBtnCount').textContent = data.length.toLocaleString();

      const uniqueCodes = [...new Set(data.map(i => i.code))];
      document.getElementById('prevCodeCount').textContent = `${uniqueCodes.length} 品番`;

      const uniqueDates = [...new Set(data.map(i => i.date))].sort().reverse();
      document.getElementById('prevDates').textContent = uniqueDates.join(', ');

      const uniqueRanks = [...new Set(data.map(i => i.rank))];
      document.getElementById('prevRanks').textContent = uniqueRanks.join(', ');

      const badgesContainer = document.getElementById('prevCodeBadges');
      badgesContainer.innerHTML = uniqueCodes.slice(0, 25).map(c => 
        `<span class="px-2 py-0.5 bg-white border border-slate-200 rounded text-slate-700 font-mono font-medium">${c}</span>`
      ).join('') + (uniqueCodes.length > 25 ? `<span class="text-slate-400 p-0.5">他 ${uniqueCodes.length - 25} 品番...</span>` : '');

      const sampleTbody = document.getElementById('previewTableBody');
      sampleTbody.innerHTML = data.slice(0, 10).map(item => `
        <tr>
          <td class="p-2.5 font-mono">${item.date}</td>
          <td class="p-2.5"><span class="px-1.5 py-0.5 bg-slate-100 rounded">${item.rank}</span></td>
          <td class="p-2.5">${item.type}</td>
          <td class="p-2.5 font-bold text-slate-800">${item.code}</td>
          <td class="p-2.5 font-mono">${item.size}</td>
          <td class="p-2.5 text-right font-mono">${formatCurrency(item.roll_sqm)}</td>
          <td class="p-2.5 text-right font-mono">${formatCurrency(item.cut_sqm)}</td>
        </tr>
      `).join('');

      document.getElementById('previewModal').classList.remove('hidden');
    }

    function closePreviewModal() {
      document.getElementById('previewModal').classList.add('hidden');
    }

    function confirmImport() {
      if (!tempParsedData || tempParsedData.length === 0) return;

      APP_DATA = [...tempParsedData];
      saveToLocalStorage();
      document.getElementById('importGuideBanner').classList.add('hidden');
      closePreviewModal();
      setupFilterOptions();
      render();

      alert(`🎉 全 ${APP_DATA.length.toLocaleString()} 件のデータを正常に取り込みました！`);
    }

    function saveToLocalStorage() {
      localStorage.setItem('FILM_PORTAL_PREVIEW_DATA', JSON.stringify(APP_DATA));
    }

    function toggleAccordion() {
      const panel = document.getElementById('filterPanel');
      const icon = document.getElementById('accordionIcon');
      const text = document.getElementById('accordionText');
      if (panel.classList.contains('collapsed')) {
        panel.classList.remove('collapsed');
        panel.classList.add('expanded');
        icon.textContent = '▲';
        text.textContent = '閉じる';
      } else {
        panel.classList.remove('expanded');
        panel.classList.add('collapsed');
        icon.textContent = '▼';
        text.textContent = '開く';
      }
    }

    function setupFilterOptions() {
      const types = [...new Set(APP_DATA.map(item => item.type).filter(Boolean))].sort();
      const dates = [...new Set(APP_DATA.map(item => item.date).filter(Boolean))].sort().reverse();

      const typeSelect = document.getElementById('typeFilter');
      typeSelect.innerHTML = '<option value="">すべて</option>' +
        types.map(t => `<option value="${t}">${t}</option>`).join('');

      const dateSelect = document.getElementById('dateFilter');
      dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
      
      if (dates.length > 0) {
        dateSelect.value = dates[0];
      }
    }

    function clearSearchInput() {
      document.getElementById('searchInput').value = '';
      applyFilters();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('typeFilter').value = '';
      document.getElementById('rankFilter').value = '工事店';
      const dateSelect = document.getElementById('dateFilter');
      if (dateSelect.options.length > 0) {
        dateSelect.selectedIndex = 0;
      }
      cardDateOverrides = {};
      cardRankOverrides = {};
      applyFilters();
    }

    function switchMode(mode) {
      currentMode = mode;
      ['rank', 'history'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        const view = document.getElementById(`view-${m}`);
        if (m === mode) {
          btn.className = "flex-1 py-2.5 px-3 text-center rounded-lg text-sm font-semibold transition-all bg-slate-900 text-white shadow-sm";
          view.classList.remove('hidden');
        } else {
          btn.className = "flex-1 py-2.5 px-3 text-center rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all";
          view.classList.add('hidden');
        }
      });
      render();
    }

    // 🔍 フィルタリングロジック（品番リアルタイム検索）
    function getFilteredData() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const type = document.getElementById('typeFilter').value;

      // 検索バッジ状態
      const badge = document.getElementById('searchActiveBadge');
      if (search) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      return APP_DATA.filter(item => {
        if (search) {
          const matchCode = String(item.code || '').toLowerCase().includes(search);
          const matchName = String(item.name || '').toLowerCase().includes(search);
          const matchSize = String(item.size || '').toLowerCase().includes(search);
          const matchType = String(item.type || '').toLowerCase().includes(search);
          if (!matchCode && !matchName && !matchSize && !matchType) return false;
        }

        if (type && item.type !== type) return false;

        return true;
      });
    }

    function applyFilters() {
      render();
    }

    function formatCurrency(val) {
      if (val === null || val === undefined || isNaN(val)) return '-';
      return '¥' + Math.round(val).toLocaleString();
    }

    // 🔴 廃盤テキストの赤色強調表示
    function getStatusBadge(status) {
      switch (status) {
        case '新製品': return '<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">新製品</span>';
        case '在庫限り': return '<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">在庫限り</span>';
        case '廃盤': return '<span class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-red-50 text-red-600 border border-red-200">廃盤</span>';
        default: return '<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600">標準</span>';
      }
    }

    function render() {
      const filtered = getFilteredData();
      
      // ユニークグループ数（製品数）をカウント
      const uniqueGroupKeys = [...new Set(filtered.map(i => `${i.code}___${i.type}___${i.condition}`))];
      document.getElementById('recordCount').textContent = uniqueGroupKeys.length;

      if (currentMode === 'rank') {
        renderRankMode(filtered);
      } else if (currentMode === 'history') {
        renderHistoryMode(filtered);
      }
    }

    function onCardDateChange(cardKey, newDate) {
      cardDateOverrides[cardKey] = newDate;
      render();
    }

    function onCardRankChange(code, newRank) {
      cardRankOverrides[code] = newRank;
      render();
    }

    // ① ランク別比較モード（製品ごとに「存在する施行日」のみをドロップダウン生成）
    function renderRankMode(data) {
      const container = document.getElementById('view-rank');
      const globalSelectedDate = document.getElementById('dateFilter').value;

      if (data.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border">該当する製品が見つかりません。検索キーワードを変更してください。</div>`;
        return;
      }

      const groupKeys = [...new Set(data.map(i => `${i.code}___${i.type}___${i.condition}`))];

      let html = '';
      groupKeys.forEach(groupKey => {
        const [code, type, condition] = groupKey.split('___');

        // この製品（品番・タイプ・条件）に実際に存在する施行日のリストのみを抽出
        const productItems = APP_DATA.filter(i => 
          String(i.code) === String(code) && 
          String(i.type) === String(type) && 
          String(i.condition) === String(condition)
        );
        
        const productDates = [...new Set(productItems.map(i => i.date))].sort().reverse();
        if (productDates.length === 0) return;

        // 個別指定された施工日（存在しない施工日の場合はデフォルトで該当製品の最新日を選択）
        let currentCardDate = cardDateOverrides[groupKey] || globalSelectedDate;
        if (!productDates.includes(currentCardDate)) {
          currentCardDate = productDates[0];
        }

        const cardItems = productItems.filter(i => String(i.date) === String(currentCardDate));
        if (cardItems.length === 0) return;

        const sample = cardItems[0];
        const sizes = [...new Set(cardItems.map(i => i.size))];

        html += `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-5 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center space-x-3">
                <span class="text-xs font-bold px-2.5 py-1 bg-slate-800 text-white rounded">${code}</span>
                <span class="text-xs font-medium px-2 py-0.5 bg-blue-50 text-blue-700 rounded border border-blue-200">${type}</span>
                <h3 class="text-base font-bold text-slate-800">${sample.name || code}</h3>
                ${getStatusBadge(sample.status)}
              </div>

              <!-- この製品に存在する施工日のみを表示する動的ドロップダウン -->
              <div class="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-slate-300 shadow-xs">
                <span class="text-xs font-bold text-slate-600">📅 施工日選択:</span>
                <select onchange="onCardDateChange('${groupKey}', this.value)" class="text-xs font-bold text-blue-700 bg-transparent outline-none cursor-pointer">
                  ${productDates.map(d => `<option value="${d}" ${d === currentCardDate ? 'selected' : ''}>${d}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="p-5 space-y-6">
              ${sizes.map(size => {
                const sizeItems = cardItems.filter(i => i.size === size);
                const ranks = ['工事店', '問屋', '組合'];

                return `
                  <div class="bg-slate-50/50 rounded-lg p-4 border border-slate-100">
                    <div class="flex items-center justify-between mb-3">
                      <span class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <span>📐</span> サイズ: ${size}
                      </span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                      ${ranks.map(rank => {
                        const rec = sizeItems.find(i => i.rank === rank) || {};
                        return `
                          <div class="bg-white p-3.5 rounded-lg border border-slate-200 relative">
                            <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
                              <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-700 rounded">${rank}</span>
                              ${rec.id ? `
                                <div class="flex gap-1">
                                  <button onclick="openEditModal('${rec.id}')" class="text-xs text-slate-400 hover:text-blue-600 p-1">✏️</button>
                                  <button onclick="deleteRecord('${rec.id}')" class="text-xs text-slate-400 hover:text-red-600 p-1">🗑️</button>
                                </div>
                              ` : ''}
                            </div>
                            
                            <div class="space-y-1.5 text-xs text-slate-600">
                              <div class="flex justify-between">
                                <span>ロール価格(本):</span>
                                <span class="font-normal text-slate-800">${formatCurrency(rec.roll_price)}</span>
                              </div>
                              <div class="flex justify-between">
                                <span>ロール単価(㎡):</span>
                                <span class="font-normal text-slate-800">${formatCurrency(rec.roll_sqm)}</span>
                              </div>
                              <div class="flex justify-between">
                                <span>切売価格(㎡):</span>
                                <span class="font-normal text-slate-800">${formatCurrency(rec.cut_sqm)}</span>
                              </div>
                              <div class="flex justify-between">
                                <span>売単価(m):</span>
                                <span class="font-normal text-slate-800">${formatCurrency(rec.cut_m)}</span>
                              </div>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ② 施行日別比較モード
    function renderHistoryMode(filteredData) {
      const container = document.getElementById('view-history');
      const globalSelectedRank = document.getElementById('rankFilter').value;

      const codeSet = [...new Set(filteredData.map(i => i.code))];

      if (codeSet.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border">該当する製品が見つかりません。検索キーワードを変更してください。</div>`;
        return;
      }

      const ranks = ['工事店', '問屋', '組合'];
      let html = '';

      codeSet.forEach(code => {
        const currentCardRank = cardRankOverrides[code] || globalSelectedRank || '工事店';

        const items = APP_DATA.filter(i => String(i.code) === String(code) && String(i.rank) === String(currentCardRank));
        if (items.length === 0) return;

        const sample = items[0];
        const dates = [...new Set(items.map(i => i.date))].sort().reverse();
        const latestDate = dates[0];

        html += `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between border-b pb-3 gap-2">
              <div class="flex items-center space-x-3">
                <span class="text-xs font-bold px-2.5 py-1 bg-slate-800 text-white rounded">${code}</span>
                <span class="text-xs font-medium px-2 py-0.5 bg-blue-50 text-blue-700 rounded">${sample.type}</span>
                <h3 class="text-base font-bold text-slate-800">${sample.name || code}</h3>
              </div>

              <!-- カード内ランク選択 -->
              <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                <span class="text-xs font-bold text-slate-600">👥 表示ランク選択:</span>
                <select onchange="onCardRankChange('${code}', this.value)" class="text-xs font-bold text-blue-700 bg-transparent outline-none cursor-pointer">
                  ${ranks.map(r => `<option value="${r}" ${r === currentCardRank ? 'selected' : ''}>${r}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="space-y-4">
              ${dates.map(date => {
                const dateItems = items.filter(i => i.date === date);
                const isLatest = (date === latestDate);

                return `
                  <div class="border rounded-lg p-3 ${isLatest ? 'bg-blue-50/40 border-blue-200' : 'bg-slate-50/50'}">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-bold ${isLatest ? 'text-blue-700' : 'text-slate-600'}">
                        📅 施行日: ${date}${isLatest ? '（最新改定日）' : ''}
                      </span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 text-xs">
                      ${dateItems.map(item => {
                        let diffBadge = '';
                        if (!isLatest) {
                          const latestItem = items.find(i => i.date === latestDate && i.size === item.size);
                          if (latestItem && latestItem.roll_sqm && item.roll_sqm) {
                            const diff = latestItem.roll_sqm - item.roll_sqm;
                            if (diff > 0) {
                              diffBadge = `<span class="text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded font-bold">+¥${diff.toLocaleString()}</span>`;
                            } else if (diff < 0) {
                              diffBadge = `<span class="text-red-700 bg-red-50 px-1.5 py-0.5 rounded font-bold">-¥${Math.abs(diff).toLocaleString()}</span>`;
                            } else {
                              diffBadge = `<span class="text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">±¥0</span>`;
                            }
                          }
                        }

                        return `
                          <div class="bg-white p-2.5 rounded border border-slate-200">
                            <div class="font-bold text-slate-700 mb-1">サイズ: ${item.size}</div>
                            <div class="flex justify-between text-slate-600">
                              <span>ロール単価(㎡):</span>
                              <span class="font-semibold text-slate-800">${formatCurrency(item.roll_sqm)}</span>
                            </div>
                            <div class="flex justify-between text-slate-600">
                              <span>切売価格(㎡):</span>
                              <span class="font-semibold text-slate-800">${formatCurrency(item.cut_sqm)}</span>
                            </div>
                            ${diffBadge ? `<div class="mt-1.5 pt-1 border-t text-right flex justify-between items-center">
                              <span class="text-[10px] text-slate-400">最新との差額:</span>
                              ${diffBadge}
                            </div>` : ''}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // CRUD操作
    function openEditModal(id = null) {
      const modal = document.getElementById('editModal');
      const title = document.getElementById('modalTitle');

      if (id) {
        const item = APP_DATA.find(i => i.id === id);
        if (!item) return;

        title.textContent = "データ編集";
        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-date').value = item.date;
        document.getElementById('edit-rank').value = item.rank;
        document.getElementById('edit-type').value = item.type;
        document.getElementById('edit-code').value = item.code;
        document.getElementById('edit-name').value = item.name || '';
        document.getElementById('edit-size').value = item.size;
        document.getElementById('edit-condition').value = item.condition || '標準';
        document.getElementById('edit-roll_price').value = item.roll_price ?? '';
        document.getElementById('edit-roll_sqm').value = item.roll_sqm ?? '';
        document.getElementById('edit-cut_sqm').value = item.cut_sqm ?? '';
        document.getElementById('edit-cut_m').value = item.cut_m ?? '';
        document.getElementById('edit-status').value = item.status || '標準';
      } else {
        title.textContent = "新規データ追加";
        document.getElementById('editForm').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('edit-date').value = new Date().toISOString().split('T')[0];
      }

      modal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveData(event) {
      event.preventDefault();
      const id = document.getElementById('edit-id').value;

      const record = {
        id: id || `${document.getElementById('edit-date').value}_${document.getElementById('edit-rank').value}_${document.getElementById('edit-type').value}_${document.getElementById('edit-code').value}_${document.getElementById('edit-size').value}`,
        date: document.getElementById('edit-date').value,
        rank: document.getElementById('edit-rank').value,
        type: document.getElementById('edit-type').value,
        code: document.getElementById('edit-code').value,
        name: document.getElementById('edit-name').value,
        size: document.getElementById('edit-size').value,
        condition: document.getElementById('edit-condition').value || '標準',
        roll_price: document.getElementById('edit-roll_price').value !== '' ? parseFloat(document.getElementById('edit-roll_price').value) : null,
        roll_sqm: document.getElementById('edit-roll_sqm').value !== '' ? parseFloat(document.getElementById('edit-roll_sqm').value) : null,
        cut_sqm: document.getElementById('edit-cut_sqm').value !== '' ? parseFloat(document.getElementById('edit-cut_sqm').value) : null,
        cut_m: document.getElementById('edit-cut_m').value !== '' ? parseFloat(document.getElementById('edit-cut_m').value) : null,
        status: document.getElementById('edit-status').value
      };

      if (id) {
        const index = APP_DATA.findIndex(i => i.id === id);
        if (index !== -1) APP_DATA[index] = record;
      } else {
        APP_DATA.unshift(record);
      }

      if (db) {
        db.collection('films').doc(record.id).set(record);
      } else {
        saveToLocalStorage();
      }

      setupFilterOptions();
      closeEditModal();
      render();
    }

    function deleteRecord(id) {
      if (!confirm('このデータを削除してもよろしいですか？')) return;

      if (db) {
        db.collection('films').doc(id).delete();
      } else {
        APP_DATA = APP_DATA.filter(i => i.id !== id);
        saveToLocalStorage();
        setupFilterOptions();
        render();
      }
    }

    // Firebase 連携
    function openSyncModal() {
      document.getElementById('syncModal').classList.remove('hidden');
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.add('hidden');
    }

    function saveFirebaseConfig() {
      const input = document.getElementById('firebaseConfigInput').value.trim();
      if (!input) return;

      try {
        const config = JSON.parse(input);
        localStorage.setItem('FIREBASE_CONFIG', JSON.stringify(config));
        initFirebase(config);
        closeSyncModal();
      } catch (e) {
        alert('JSONフォーマットが不正です。');
      }
    }

    function clearFirebaseConfig() {
      localStorage.removeItem('FIREBASE_CONFIG');
      localStorage.removeItem('FILM_PORTAL_PREVIEW_DATA');
      if (unsubscribeFirestore) unsubscribeFirestore();
      db = null;
      document.getElementById('firebaseStatusContainer').classList.add('hidden');
      closeSyncModal();
      loadInitialData();
    }

    function initFirebaseIfConfigured() {
      const saved = localStorage.getItem('FIREBASE_CONFIG');
      if (saved) {
        try {
          const config = JSON.parse(saved);
          document.getElementById('firebaseConfigInput').value = JSON.stringify(config, null, 2);
          initFirebase(config);
        } catch (e) {}
      }
    }

    function initFirebase(config) {
      if (!firebase.apps.length) {
        firebase.initializeApp(config);
      }
      db = firebase.firestore();

      const statusContainer = document.getElementById('firebaseStatusContainer');
      const statusDot = document.getElementById('firebaseStatusDot');
      const statusText = document.getElementById('firebaseStatusText');

      statusContainer.classList.remove('hidden');
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse';
      statusText.textContent = 'Firebase Firestore リアルタイム同期中';

      unsubscribeFirestore = db.collection('films').onSnapshot(snapshot => {
        if (!snapshot.empty) {
          const remoteData = [];
          snapshot.forEach(doc => remoteData.push(doc.data()));
          APP_DATA = remoteData;
          setupFilterOptions();
          render();
        }
      }, err => {
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 inline-block';
        statusText.textContent = 'Firebase接続エラー';
      });
    }
  </script>
</body>
</html>
